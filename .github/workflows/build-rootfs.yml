name: Build ImmortalWrt Docker rootfs (armsr/armv8)

on:
  workflow_dispatch:
    inputs:
      imm_ref:
        description: 'ImmortalWrt source ref (branch/tag/commit)'
        required: false
        default: 'master'
      proxy_plugin:
        description: 'Proxy plugin to embed'
        required: false
        default: 'luci-app-openclash'
        type: choice
        options:
          - luci-app-openclash
          - luci-app-passwall
          - luci-app-homeproxy
          - none
  push:
    branches: [main]
    paths:
      - 'config/**'
      - '.github/workflows/build-rootfs.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip \
            zlib1g-dev file wget qemu-utils ccache libelf-dev

      - name: Clone ImmortalWrt (${{ github.event.inputs.imm_ref || 'master' }})
        run: |
          REF="${{ github.event.inputs.imm_ref || 'master' }}"
          echo "Cloning ImmortalWrt @ $REF"
          git clone --depth 1 --branch "$REF" \
            https://github.com/immortalwrt/immortalwrt.git imm
          cd imm
          echo "IMM_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %ad %s' --date=iso

      - name: Update & install feeds
        working-directory: imm
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply defconfig
        working-directory: imm
        run: |
          PLUGIN="${{ github.event.inputs.proxy_plugin || 'luci-app-openclash' }}"
          cp ../config/imm-docker-defconfig .config
          # 按输入切换科学上网插件
          if [ "$PLUGIN" != "luci-app-openclash" ]; then
            sed -i 's/^CONFIG_PACKAGE_luci-app-openclash=y/# CONFIG_PACKAGE_luci-app-openclash is not set/' .config
          fi
          if [ "$PLUGIN" != "none" ]; then
            grep -q "CONFIG_PACKAGE_${PLUGIN}=y" .config || echo "CONFIG_PACKAGE_${PLUGIN}=y" >> .config
          fi
          make defconfig
          echo "=== key config ==="
          grep -E 'CONFIG_TARGET_(armsr|PROFILE|ROOTFS_TARGZ)|CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall|luci-app-homeproxy|luci-theme-argon|docker)=' .config | sort

      - name: Download all sources
        working-directory: imm
        run: make -j$(nproc) download V=s
        continue-on-error: true

      - name: Build rootfs
        working-directory: imm
        run: |
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "EXIT=${PIPESTATUS[0]}"

      - name: Collect artifacts
        working-directory: imm
        run: |
          mkdir -p ../out
          echo "=== bin/targets/armsr/armv8 ==="
          ls -lh bin/targets/armsr/armv8/ || true
          cp -v bin/targets/armsr/armv8/*rootfs.tar.gz ../out/ 2>/dev/null || true
          cp -v bin/targets/armsr/armv8/*.manifest ../out/ 2>/dev/null || true
          cp -v bin/targets/armsr/armv8/sha256sums ../out/ 2>/dev/null || true
          echo "=== out ==="
          ls -lh ../out/

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-docker-rootfs
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Build log tail (on failure)
        if: failure()
        working-directory: imm
        run: tail -200 build.log || true
