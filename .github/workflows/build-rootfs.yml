name: Build ImmortalWrt Docker rootfs (armsr/armv8)

on:
  workflow_dispatch:
    inputs:
      imm_ref:
        description: 'ImmortalWrt source ref (branch/tag/commit)'
        required: false
        default: 'master'
      proxy_plugin:
        description: 'Proxy plugin to embed'
        required: false
        default: 'luci-app-openclash'
        type: choice
        options:
          - luci-app-openclash
          - luci-app-passwall
          - luci-app-homeproxy
          - none
      strip_nic_drivers:
        description: 'Strip armsr default physical NIC drivers (useless in containers)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [main]
    paths:
      - 'config/**'
      - '.github/workflows/build-rootfs.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # NOTE: python3-distutils was removed in Ubuntu 24.04; python3 is preinstalled.
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget qemu-utils ccache libelf-dev python3 python3-setuptools

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-armsr-armv8-slim-${{ github.sha }}
          restore-keys: ccache-armsr-armv8-slim-

      - name: Clone ImmortalWrt
        run: |
          REF="${{ github.event.inputs.imm_ref || 'master' }}"
          echo "Cloning ImmortalWrt @ $REF"
          git clone --depth 1 --branch "$REF" \
            https://github.com/immortalwrt/immortalwrt.git imm
          cd imm
          echo "IMM_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %ad %s' --date=iso

      - name: Update & install feeds
        working-directory: imm
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Strip physical NIC drivers from armsr generic device
        if: ${{ (github.event.inputs.strip_nic_drivers || 'true') == 'true' }}
        working-directory: imm
        run: |
          F=target/linux/armsr/image/Makefile
          cp "$F" "$F.orig"
          python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]
          lines = open(p, 'r', newline='').read().split('\n')

          # The armsr 'generic' device appends ~28 physical NIC / PHY / SFP / RTC
          # driver packages. A container shares the host kernel and network stack,
          # so every one of them is dead weight. Remove the whole statement
          # (line-based, so multi-line '\' continuations are handled correctly).
          out, i, removed = [], 0, []
          while i < len(lines):
              line = lines[i]
              if line.lstrip().startswith('DEVICE_PACKAGES +='):
                  while i < len(lines):
                      cur = lines[i]
                      removed += [t for t in cur.replace('\\', ' ').split()
                                  if t.startswith('kmod-') or t == 'partx-utils']
                      i += 1
                      if not cur.rstrip('\r').rstrip().endswith('\\'):
                          break
                  out.append('\t# DEVICE_PACKAGES intentionally removed for container builds:')
                  out.append('\t# physical NIC/PHY/SFP/RTC drivers are useless when the container')
                  out.append('\t# shares the host kernel and network stack.')
                  continue
              out.append(line)
              i += 1

          open(p, 'w', newline='').write('\n'.join(out))
          print("stripped %d driver entries:" % len(removed))
          for t in removed:
              print("   -", t)
          PY
          echo "=== resulting Device/generic ==="
          sed -n '/^define Device\/generic/,/^endef/p' "$F"
          if sed -n '/^define Device\/generic/,/^endef/p' "$F" | grep -q 'kmod-'; then
            echo "FATAL: NIC kmods still present after strip"; exit 1
          fi
          echo "OK: no NIC kmods left in Device/generic"

      - name: Apply defconfig
        working-directory: imm
        run: |
          PLUGIN="${{ github.event.inputs.proxy_plugin || 'luci-app-openclash' }}"

          cp ../config/imm-docker-defconfig .config

          # --- switch proxy plugin ---
          if [ "$PLUGIN" != "luci-app-openclash" ]; then
            sed -i 's/^CONFIG_PACKAGE_luci-app-openclash=y/# CONFIG_PACKAGE_luci-app-openclash is not set/' .config
          fi
          if [ "$PLUGIN" != "none" ]; then
            grep -q "^CONFIG_PACKAGE_${PLUGIN}=y" .config || echo "CONFIG_PACKAGE_${PLUGIN}=y" >> .config
          fi

          make defconfig

          echo "=== VERIFY: target ==="
          grep -E '^CONFIG_TARGET_armsr|^CONFIG_TARGET_PROFILE' .config
          echo "=== VERIFY: rootfs tarball ==="
          grep -E '^CONFIG_TARGET_ROOTFS_TARGZ' .config
          echo "=== VERIFY: must be ON ==="
          for p in luci luci-theme-argon luci-app-openclash dnsmasq-full firewall4 \
                   nftables iptables-nft ipset kmod-tun kmod-nft-tproxy kmod-inet-diag \
                   ruby ruby-yaml luci-app-ttyd bash curl; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config && echo "  ON   $p" || echo "  OFF  $p  <-- PROBLEM"
          done
          echo "=== VERIFY: must be OFF (container-useless) ==="
          for p in dockerd docker docker-compose luci-app-dockerman parted lsblk \
                   block-mount kmod-fs-ext4 kmod-usb-storage \
                   kmod-mt7915e kmod-mt7916-firmware wpad-openssl; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  ON   $p  <-- SHOULD BE OFF"
            else
              echo "  off  $p"
            fi
          done
          echo "=== VERIFY: NIC kmods stripped? ==="
          grep -cE '^CONFIG_PACKAGE_kmod-(e1000e|vmxnet3|atlantic|bcmgenet|mvneta|dwmac-rockchip)=y' .config || true

      - name: Sanity check target supports targz
        working-directory: imm
        run: |
          if ! grep -q '^CONFIG_TARGET_ROOTFS_TARGZ=y' .config; then
            echo "FATAL: CONFIG_TARGET_ROOTFS_TARGZ is not enabled"; exit 1
          fi
          echo "OK: targz enabled"

      - name: Download all sources
        working-directory: imm
        run: make -j$(nproc) download V=s
        continue-on-error: true

      - name: Build rootfs
        working-directory: imm
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Collect artifacts
        if: always()
        working-directory: imm
        run: |
          mkdir -p ../out
          echo "=== bin/targets/armsr/armv8 ==="
          ls -lh bin/targets/armsr/armv8/ || true
          cp -v bin/targets/armsr/armv8/*rootfs.tar.gz ../out/ 2>/dev/null || true
          cp -v bin/targets/armsr/armv8/*.manifest    ../out/ 2>/dev/null || true
          cp -v bin/targets/armsr/armv8/sha256sums    ../out/ 2>/dev/null || true
          cp -v .config ../out/config.final 2>/dev/null || true
          echo "=== out ==="
          ls -lh ../out/ || true

      - name: Upload rootfs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-docker-rootfs
          path: out/*
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Build log tail (on failure)
        if: failure()
        working-directory: imm
        run: tail -250 build.log || true
